<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMNX - Admin Giriş</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page-body">

    <!-- Üst Menü / Navbar -->
    <header>
        <div class="nav-pill-container" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
            <a href="index.html" class="nav-brand">
                <div class="brand-icon"><i class="fa-solid fa-gamepad"></i></div>
                <div class="brand-texts">
                    <h2>CMNX</h2>
                    <span>ADMIN</span>
                </div>
            </a>
            <div class="nav-right-actions" style="display: flex; align-items: center; gap: 10px;">
                <a href="index.html" class="btn-login-nav"><i class="fa-solid fa-house"></i> Ana Sayfa</a>
            </div>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo-icon"><i class="fa-solid fa-lock"></i></div>
                <h1>Admin Paneli</h1>
                <p>Yönetici yetkileri için giriş yapın</p>
            </div>

            <form id="adminLoginForm">
                <div class="auth-form-group">
                    <label>Admin Kullanıcı Adı</label>
                    <div class="auth-input-wrapper">
                        <input type="text" id="adminUser" placeholder="Kullanıcı adı" required autocomplete="off">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label>Şifre</label>
                    <div class="auth-input-wrapper">
                        <input type="password" id="adminPass" placeholder="••••••••" required autocomplete="current-password">
                        <i class="fa-solid fa-key"></i>
                    </div>
                </div>

                <div id="adminLoginError" class="message-area message-error" style="margin-bottom:15px; font-size:0.85rem; display:none;"></div>

                <button type="submit" class="auth-submit-btn">Giriş Yap</button>
            </form>

            <div class="auth-footer-link">
                <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Ana Sayfaya Geri Dön</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 CMNX Platform. Tüm hakları saklıdır.</p>
    </footer>

    <script>
        const adminLoginForm = document.getElementById('adminLoginForm');
        if (adminLoginForm) {
            adminLoginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const u = document.getElementById('adminUser').value;
                const p = document.getElementById('adminPass').value;
                const err = document.getElementById('adminLoginError');

                // Şifre: admin1234
                if (u === 'admin' && p === 'admin1234') {
                    localStorage.setItem('cmnx_logged', 'true');
                    localStorage.setItem('cmnx_logged_user', 'Admin');
                    window.location.href = "admin.html";
                } else {
                    // Güvenli hata mesajı: Asla girilen kullanıcı adı veya şifre ekrana yansıtılmaz!
                    err.style.display = 'block';
                    err.textContent = "Hatalı kullanıcı adı veya şifre!";
                    
                    // Input alanlarını temizle (güvenlik için)
                    document.getElementById('adminPass').value = '';
                }
            });
        }
    </script>
</body>
</html>
