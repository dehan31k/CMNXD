<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMNX - Kayıt Ol</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page-body">

    <!-- Üst Menü / Navbar -->
    <header>
        <div class="nav-pill-container">
            <a href="index.html" class="nav-brand">
                <div class="brand-icon"><i class="fa-solid fa-gamepad"></i></div>
                <div class="brand-texts">
                    <h2>CMNX</h2>
                    <span>PLATFORM</span>
                </div>
            </a>
            
            <div class="nav-right-actions">
                <a href="giris.html" class="btn-login-nav"><i class="fa-solid fa-right-to-bracket"></i> Giriş Yap</a>
                <a href="kayit.html" class="btn-register-nav"><i class="fa-solid fa-user-plus"></i> Kayıt Ol</a>
            </div>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo-icon"><i class="fa-solid fa-rocket"></i></div>
                <h1>Aramıza Katılın</h1>
                <p>Hemen ücretsiz bir hesap oluşturun</p>
            </div>

            <div class="auth-tabs-modern">
                <a href="giris.html" class="auth-tab-btn">Giriş Yap</a>
                <a href="kayit.html" class="auth-tab-btn active">Kayıt Ol</a>
            </div>

            <form id="registerForm">
                <div class="auth-form-group">
                    <label>Kullanıcı Adı</label>
                    <div class="auth-input-wrapper">
                        <input type="text" id="regName" placeholder="Adınız" required>
                        <i class="fa-solid fa-user-tag"></i>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label>E-posta Adresi</label>
                    <div class="auth-input-wrapper">
                        <input type="email" id="regEmail" placeholder="ornek@mail.com" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label>Şifre</label>
                    <div class="auth-input-wrapper">
                        <input type="password" id="regPassword" placeholder="••••••••" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label>Şifre Tekrar</label>
                    <div class="auth-input-wrapper">
                        <input type="password" id="regPasswordConfirm" placeholder="••••••••" required>
                        <i class="fa-solid fa-shield-check"></i>
                    </div>
                </div>

                <div id="regMessage" class="message-area message-error" style="margin-bottom:10px; font-size:0.85rem;"></div>

                <button type="submit" class="auth-submit-btn">Kayıt Ol</button>
            </form>

            <div class="auth-footer-link">
                <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Ana Sayfaya Geri Dön</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 CMNX Platform. Tüm hakları saklıdır.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
